# Continuous integration -- the fast half (T0084).
#
# Everything here is meant to finish in minutes, because a CI run slow enough to
# be ignored provides no signal. These jobs configure, build only the test
# binaries and run the suites; the full ~1100-target engine build lives in
# full-build.yml and runs nightly, where its cost does not sit between a push
# and knowing whether it broke something.
#
# `.harness/` is cached because it is 635 MB of pure download and nothing else.
# Build trees are NOT cached: they are ~1.7 GB (Linux) and ~1.3 GB (Windows),
# which would consume most of the repository's 10 GB cache quota, and restoring
# that much is not obviously faster than rebuilding it.
#
# Nothing here installs ccache -- and that turned out not to matter, which is
# the lesson. The windows-latest image already ships one at C:\Strawberry\c\bin,
# `build.zig` adopts any ccache it finds on PATH, and that copy cannot exec the
# generated `.cmd` compiler shim, so the first CI run died compiling enkiTS.
# Not installing something is not the same as it being absent. `build.zig` now
# declines to adopt a PATH-discovered ccache on a Windows host; see the comment
# there for the measurements.

name: CI

# Documentation-only pushes cannot fail a build or a test, so they skip the
# matrix below via paths-ignore. Most of this repo's commits touch only
# claude_documentation/ (backlog tickets, design docs) or a root-level *.md,
# and burning ~19 minutes of runners on a paragraph edit proves nothing.
#
# Keep this list narrow -- anything that can affect a build or test result
# must still trigger CI. In particular, resist the urge to add bootstrap.sh
# or bootstrap.ps1 here because they "look like" install scripts nobody but a
# human reads: tests/harness/pins_test.zig opens both of them at test time
# and asserts their pinned versions and install layout against build.zig, so
# they are test inputs, not documentation. The same caution applies before
# ever widening `*.md` to `**.md` or adding another root path here -- check
# whether a test reads the file first, don't assume markdown is inert.
#
# paths-ignore also has a sharp edge that has nothing to do with what's
# listed below: on a repo with required status checks configured, a job that
# never runs also never reports a status, and a required-but-skipped check
# leaves the PR stuck at "waiting for status" forever, with no failure to
# point at. This repo has no branch protection on main today (checked via
# `gh api repos/ywadi/hollow_point/branches/main/protection`, which 404s), so
# that trap does not apply -- but if required checks are ever turned on for
# the jobs below, paths-ignore stops being the right tool and the fix is a
# cheap filter job that always reports a result instead.
on:
  push:
    branches: [main]
    # See the note above `on:` for what this excludes and why.
    paths-ignore:
      - 'claude_documentation/**'
      - '*.md'
  pull_request:
    # Same list as push, above.
    paths-ignore:
      - 'claude_documentation/**'
      - '*.md'
  workflow_dispatch:

# A superseded push should not keep burning runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests-linux-host:
    name: Tests (Linux host, both targets)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Cache the pinned toolchain
        uses: actions/cache@v6
        with:
          path: .harness
          # The pins and their checksums live in bootstrap.sh, so it is the
          # correct thing to key on: bump a version, get a fresh toolchain.
          key: harness-linux-${{ hashFiles('bootstrap.sh') }}

      - name: Bootstrap the toolchain
        run: ./bootstrap.sh

      - name: Put the pinned zig on PATH
        # Read the version out of bootstrap.sh rather than repeating it here --
        # a second copy of the pin is a second thing to forget to update.
        run: |
          zig_version=$(grep -m1 '^ZIG_VERSION=' bootstrap.sh | cut -d= -f2)
          echo "$PWD/.harness/zig/linux-$(uname -m)/$zig_version" >> "$GITHUB_PATH"

      - name: Install wine
        # Needed to run the *Windows* suite on a Linux host. Without it the
        # harness builds that suite and declines to run it with a warning
        # (never a silent pass), so this is what makes the second half of the
        # matrix real. Package name differs across Ubuntu releases.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine \
            || sudo apt-get install -y --no-install-recommends wine64

      # Cache the build tree, keyed on what actually determines its third-party
      # contents: the submodule SHAs plus the CMake and toolchain files. Our own
      # sources are deliberately NOT in the key -- they change every commit, so
      # including them would mean never hitting the cache. Ninja then rebuilds
      # only the handful of engine files that changed and leaves SDL, Diligent,
      # enkiTS, ozz and meshoptimizer alone.
      #
      # This is the principle the previous attempt missed: pinned code that has
      # not moved must not recompile. ccache was tried first and did not deliver
      # it -- it saw 82 of roughly 4,248 compilations, for reasons recorded in
      # T0121 -- so this caches the *output* rather than hoping to cache the
      # compilations.
      #
      # This job is the expensive one: build.zig lays trees out as
      # build/<target>-<buildtype>, and this job builds BOTH targets, so `build`
      # covers linux-x86_64-* and windows-x86_64-* together. Trees are large
      # (~1.7 GB here, ~1.3 GB on Windows) against a 10 GB quota, which is why
      # ci.yml originally declined to cache them. That judgement was made when a
      # full build was ~4 minutes; at 22 it no longer holds, and GitHub evicts
      # least-recently-used entries rather than failing.
      - name: Key the build cache on the pinned dependencies
        run: |
          git submodule status --recursive | awk '{print $1, $2}' > .ci-dep-key
          sha256sum CMakeLists.txt cmake/toolchains/*.cmake >> .ci-dep-key
          echo "--- key inputs ---" && head -5 .ci-dep-key

      - name: Cache the build tree
        uses: actions/cache@v6
        with:
          path: build
          key: buildtree-${{ runner.os }}-${{ hashFiles('.ci-dep-key') }}
          restore-keys: |
            buildtree-${{ runner.os }}-

      - name: Run every test bucket, both targets
        run: zig build test -Dtest=all

      # Reported so the effect is visible rather than assumed -- a cache that
      # silently misses looks exactly like one that works. A restore that hit
      # shows a tree already near full size before the build step runs.
      - name: Build tree size
        if: always()
        run: du -sh build 2>/dev/null || true

  tests-windows-host:
    name: Tests (Windows host, native)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Cache the pinned toolchain
        uses: actions/cache@v6
        with:
          path: .harness
          key: harness-windows-${{ hashFiles('bootstrap.ps1') }}

      # Defender scans every freshly-linked executable, and this job links ~300
      # of them and then immediately *runs* several. Twice out of three runs the
      # Zig test runners (harness-paths, harness-pins, harness-cache -- a
      # different pair each time, which is the tell) exceeded the 60s the build
      # waits for a runner to respond, failing right after the link step while
      # ninja was still finishing.
      #
      # Excluding the workspace and the toolchain is the standard fix for this
      # on windows-latest. It is not a masking retry: the tests were never
      # failing, they were never getting to start.
      #
      # If this does not fix it, the next suspects are runner CPU saturation
      # (the zig test binaries launch while ninja is still linking) and the
      # test runner's --listen=- protocol on Windows specifically.
      - name: Exclude the workspace from Defender
        run: |
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE"
          Add-MpPreference -ExclusionProcess "zig.exe"
          Add-MpPreference -ExclusionProcess "ninja.exe"
        continue-on-error: true

      - name: Bootstrap the toolchain
        # Exercises bootstrap.ps1 end to end, including the archive
        # extract-and-rename logic that differs from the Linux path.
        run: .\bootstrap.ps1

      - name: Put the pinned zig on PATH
        # No '$' in the regex: PowerShell would interpolate it inside a
        # double-quoted string rather than passing it to the matcher.
        run: |
          $v = (Select-String -Path bootstrap.ps1 -Pattern "ZigVersion\s*=\s*'([\d.]+)'" | Select-Object -First 1).Matches[0].Groups[1].Value
          "$PWD\.harness\zig\windows-x86_64\$v" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # Same build-tree cache as tests-linux-host, for the reasons spelled out
      # there. It matters more here than anywhere: T0084 established that this
      # host cannot use ccache at all -- build.zig declines a PATH-discovered one
      # because the runner's copy cannot exec the generated .cmd compiler shim --
      # so a tree cache is the only lever Windows has.
      #
      # runner.os keeps the two jobs' entries apart, which they must be: this job
      # passes -Dtarget=windows and so populates only build/windows-x86_64-*,
      # where tests-linux-host populates both targets.
      - name: Key the build cache on the pinned dependencies
        shell: bash
        run: |
          git submodule status --recursive | awk '{print $1, $2}' > .ci-dep-key
          sha256sum CMakeLists.txt cmake/toolchains/*.cmake >> .ci-dep-key
          echo "--- key inputs ---" && head -5 .ci-dep-key

      - name: Cache the build tree
        uses: actions/cache@v6
        with:
          path: build
          key: buildtree-${{ runner.os }}-${{ hashFiles('.ci-dep-key') }}
          restore-keys: |
            buildtree-${{ runner.os }}-

      - name: Run every test bucket, Windows target
        # -Dtarget=windows on purpose. Without it the harness would also
        # configure and build the *Linux* target here -- a second full CMake
        # configure -- only to decline to run it, since a Windows runner has
        # neither WSL nor wine. This job exists to prove the native Windows
        # path; tests-linux-host covers the Linux suite, and T0004 already
        # proved Linux-from-Windows cross-compiles.
        run: zig build test -Dtest=all -Dtarget=windows

      # Same reason as the Linux report: an ineffective cache is invisible
      # without one. PowerShell, because this job's default shell is not bash.
      - name: Build tree size
        if: always()
        run: |
          if (Test-Path build) {
            "{0:N0} MB" -f ((Get-ChildItem -Recurse build | Measure-Object Length -Sum).Sum / 1MB)
          }

  api-docs-current:
    name: API reference is up to date
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Cache the pinned toolchain
        uses: actions/cache@v6
        with:
          key: harness-linux-${{ hashFiles('bootstrap.sh') }}
          path: .harness

      - name: Bootstrap the toolchain
        run: ./bootstrap.sh

      - name: Put the pinned zig on PATH
        run: |
          zig_version=$(grep -m1 '^ZIG_VERSION=' bootstrap.sh | cut -d= -f2)
          echo "$PWD/.harness/zig/linux-$(uname -m)/$zig_version" >> "$GITHUB_PATH"

      - name: Install libclang
        run: pip install libclang

      # The whole point of generating the reference in the build rather than
      # only checking it in CI: the gate is "regenerate, then fail if anything
      # moved". No second header-parsing pass, no drift detector to maintain.
      #
      # Stale output here is a correctness bug rather than a documentation one --
      # the consumer is a coding agent, and an outdated reference makes it write
      # calls to functions that do not exist (T0118).
      - name: Regenerate, lint and check for drift
        # `zig build docs` does two things, both enforced here rather than
        # available: it *checks* the documentation against a ratchet baseline
        # (missing doc comments, missing @param, and -- the one that matters --
        # an @param naming a parameter that no longer exists), and it
        # regenerates the reference. The dirty-tree test below then catches
        # anyone who changed a header without regenerating.
        #
        # Both failures are correctness failures for the consumer: the reader is
        # a coding agent, and documentation that is confidently wrong makes it
        # write confidently wrong code (T0118).
        run: |
          zig build docs
          if ! git diff --quiet -- docs/api; then
            echo "::error::docs/api is out of date -- run 'zig build docs' and commit the result"
            git diff --stat -- docs/api
            exit 1
          fi
          echo "API reference matches the headers"

  offline-configure:
    name: Configure with FetchContent disconnected
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Cache the pinned toolchain
        uses: actions/cache@v6
        with:
          path: .harness
          key: harness-linux-${{ hashFiles('bootstrap.sh') }}

      - name: Bootstrap the toolchain
        run: ./bootstrap.sh

      - name: Put the pinned zig on PATH
        run: |
          zig_version=$(grep -m1 '^ZIG_VERSION=' bootstrap.sh | cut -d= -f2)
          echo "$PWD/.harness/zig/linux-$(uname -m)/$zig_version" >> "$GITHUB_PATH"

      - name: Configure, then prove nothing was downloaded
        # Guards D7/T0010: EnTT, abseil and rapidjson must resolve to the
        # vendored checkouts via FETCHCONTENT_SOURCE_DIR_*. When a redirect is
        # in place FetchContent populates only `_deps/<name>-build`; if one is
        # ever lost it downloads to `_deps/<name>-src`, which is what this
        # catches. Verified by hand during T0004.
        #
        # Note this asserts on the *result* rather than setting
        # FETCHCONTENT_FULLY_DISCONNECTED, which is a cache variable and is not
        # read from the environment -- setting it here would look like a check
        # and test nothing. A job with genuinely no network is stronger still
        # and is not set up here; see the T0084 notes.
        run: |
          zig build configure -Dtarget=linux
          if ls -d build/linux-x86_64-release/_deps/*-src 2>/dev/null | grep -q .; then
            echo "::error::FetchContent downloaded into _deps/*-src -- a vendored redirect was lost"
            ls -d build/linux-x86_64-release/_deps/*-src
            exit 1
          fi
          echo "no _deps/*-src: every dependency resolved to its vendored checkout"
