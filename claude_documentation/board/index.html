<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HollowPoint — Backlog</title>
<style>
  :root {
    --bg:#0f1115; --panel:#161922; --panel2:#1c2029; --line:#272c38;
    --fg:#e6e9ef; --dim:#8b93a7; --accent:#5b9dff;
    --open:#8b93a7; --prog:#e0a33e; --done:#3fb950; --blocked:#d9534f;
    /* Its own colour, used for nothing else on this board. Amber already means
       "in progress" and red already means "blocked", and a decision is neither
       -- it is "stop, this one is not yours". Borrowing either would make the
       one row that must not be misread the one row that looks like something
       familiar. */
    --decision:#ff9d4a;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--bg); color:var(--fg);
    font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  header {
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
    padding:14px 20px; border-bottom:1px solid var(--line); background:var(--panel);
    position:sticky; top:0; z-index:5;
  }
  h1 { font-size:16px; margin:0; font-weight:650; letter-spacing:.2px; }
  .spacer { flex:1; }
  .meta { color:var(--dim); font-size:12px; display:flex; align-items:center; gap:8px; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--done); }
  .dot.stale { background:var(--prog); }
  .dot.err { background:var(--blocked); }

  a.nav { color:var(--accent); text-decoration:none; font-size:12.5px;
          border:1px solid var(--line); border-radius:6px; padding:4px 10px; }
  a.nav:hover { border-color:var(--accent); }
  .controls { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--dim); }
  .controls select, .ctl {
    background:var(--panel2); color:var(--fg); border:1px solid var(--line);
    border-radius:6px; padding:3px 8px; font-size:11.5px; cursor:pointer;
  }
  .controls select:hover, .ctl:hover { border-color:var(--accent); }

  .search-wrap { position:relative; display:flex; align-items:center; }
  .search-wrap input {
    background:var(--panel2); color:var(--fg); border:1px solid var(--line);
    border-radius:6px; padding:3px 22px 3px 8px; font-size:11.5px; cursor:text;
    width:180px; font-family:inherit;
  }
  .search-wrap input::placeholder { color:var(--dim); }
  .search-wrap input:hover { border-color:var(--accent); }
  .search-wrap input:focus { outline:none; border-color:var(--accent); }
  .search-clear {
    position:absolute; right:2px; top:50%; transform:translateY(-50%);
    background:none; border:none; color:var(--dim); cursor:pointer;
    font-size:12px; line-height:1; padding:4px 5px; border-radius:4px; display:none;
  }
  .search-clear:hover { color:var(--fg); }
  .search-wrap.has-value .search-clear { display:block; }

  /* GitHub Actions status + repo link. These were <img src=".../badge.svg">
     tags; they are now painted from /api/ci, because the badge image cannot
     express either of the two states this repository needs -- it calls a
     cancelled run "failing" and has no in-flight state at all. The long note
     in server.js has the measurement. Everything below is the rendering of
     the distinction, not the deriving of it, which happens server-side.

     .ci-state carries a min-width for the same reason the old badge box had a
     fixed width: this is a sticky header, and it must not shuffle sideways
     every time a run starts, finishes or gets cancelled. */
  .gh-links { display:flex; align-items:center; gap:10px; }
  .ci-badge {
    display:flex; align-items:center; gap:7px; text-decoration:none;
    color:var(--dim); font-size:11px; white-space:nowrap;
    border:1px solid var(--line); border-radius:6px; padding:3px 9px;
    background:var(--panel2);
  }
  .ci-badge:hover { border-color:var(--accent); }
  .ci-name { font-weight:600; color:var(--fg); }
  .ci-state { display:inline-flex; align-items:center; gap:5px; min-width:66px; }
  .ci-dot { width:8px; height:8px; border-radius:50%; background:var(--dim); flex:none; }
  .ci-label { color:var(--dim); }
  /* The second line of the story, and the reason bug #1 was misleading rather
     than merely wrong: a green that comes from an older run than the newest
     push has to say so, or it reads as a verdict on code nothing has tested.
     Always in the DOM and always reserved, empty or not -- otherwise the header
     gains a whole row the moment a build starts, which is exactly the kind of
     reflow the fixed-size badge box was there to prevent. */
  .ci-note { color:var(--dim); opacity:.7; font-size:10px; min-width:86px; }

  .ci-badge[data-state="success"] .ci-dot { background:var(--done); }
  .ci-badge[data-state="success"] .ci-label { color:var(--done); }
  .ci-badge[data-state="failure"] .ci-dot,
  .ci-badge[data-state="action_required"] .ci-dot { background:var(--blocked); }
  .ci-badge[data-state="failure"] .ci-label,
  .ci-badge[data-state="action_required"] .ci-label { color:var(--blocked); }
  /* Building borrows the In Progress column's amber, so the header and the
     board mean the same thing by the same colour. The pulse is what separates
     "running right now" from a settled state at a glance. */
  .ci-badge[data-state="in_progress"] .ci-dot { background:var(--prog); animation:ci-pulse 1.4s ease-in-out infinite; }
  .ci-badge[data-state="in_progress"] .ci-label { color:var(--prog); }
  /* Queued is the same amber, hollow: accepted but not executing. A solid
     pulsing dot would claim a runner has picked it up when none has. */
  .ci-badge[data-state="queued"] .ci-dot { background:transparent; box-shadow:inset 0 0 0 2px var(--prog); }
  .ci-badge[data-state="queued"] .ci-label { color:var(--prog); }
  /* cancelled, skipped, no runs and unavailable all stay grey and stay
     lowercase: each is the *absence* of a verdict, not a bad one. Painting
     them red is precisely the mistake this replaced. */
  .ci-badge[data-state="cancelled"] .ci-dot,
  .ci-badge[data-state="skipped"] .ci-dot { background:var(--dim); box-shadow:inset 0 0 0 2px var(--panel2); }
  @keyframes ci-pulse { 0%,100% { opacity:1; } 50% { opacity:.3; } }
  @media (prefers-reduced-motion: reduce) { .ci-badge .ci-dot { animation:none !important; } }

  /* search hides cards/groups by class rather than by leaving them out of the
     render, so phase aggregates (computed from the full task list) never see
     a filtered subset */
  .card.search-hidden, .phase.search-hidden { display:none; }

  /* --- current ticket sequence ---------------------------------------------
     Rendered from /api/sequence, which parses it out of backlog/README.md.
     Nothing here is authored in this file: if a row is wrong, the README is
     wrong, and the source path in the panel header says so on screen so the
     reader knows where to go rather than looking for it in the board code. */
  .seq { margin:18px 20px 0; background:var(--panel); border:1px solid var(--line); border-radius:10px; }
  .seq-head {
    display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;
    padding:11px 14px; border-bottom:1px solid var(--line);
  }
  .seq-title { font-size:12px; text-transform:uppercase; letter-spacing:.8px; color:var(--dim); font-weight:650; }
  .seq-date { font:11px ui-monospace,SFMono-Regular,Menlo,monospace; color:var(--fg);
              background:var(--panel2); border:1px solid var(--line); border-radius:20px; padding:1px 9px; }
  .seq-date.missing { color:var(--blocked); border-color:#5a2b2b; }
  .seq-note { font-size:11.5px; color:var(--dim); }
  .seq-src { margin-left:auto; font:11px ui-monospace,SFMono-Regular,Menlo,monospace; color:var(--dim); }
  .seq-rows { padding:11px 12px; display:flex; flex-direction:column; gap:8px; }

  .seq-row {
    display:grid; grid-template-columns:22px minmax(96px,auto) 1fr; gap:12px; align-items:start;
    background:var(--panel2); border:1px solid var(--line); border-left:3px solid var(--line);
    border-radius:8px; padding:9px 12px;
  }
  .seq-row[data-open="1"] { cursor:pointer; }
  .seq-row[data-open="1"]:hover { border-color:var(--accent); border-left-color:var(--accent); }
  .seq-pos { font:700 11px/1.5 ui-monospace,Menlo,monospace; color:var(--dim); text-align:right; }
  .seq-meta { display:flex; flex-direction:column; gap:5px; align-items:flex-start; }
  .seq-id { font:600 11.5px ui-monospace,SFMono-Regular,Menlo,monospace; color:var(--accent); }
  .seq-kind {
    font:600 9.5px/1 ui-monospace,Menlo,monospace; letter-spacing:.7px;
    border:1px solid var(--line); border-radius:20px; padding:3px 7px; color:var(--dim);
  }
  .seq-why { font-size:12.5px; line-height:1.55; color:var(--fg); }
  .seq-why code { font:11.5px ui-monospace,Menlo,monospace; background:#0d0f14; padding:1px 4px; border-radius:4px; }
  .seq-why strong { color:#fff; }

  /* The decision row. Everything below exists for one reason: an agent or a
     person skimming this must not read T0141.0 as work to pick up. Colour
     alone would not do it -- so it is colour, plus a solid badge, plus a line
     of text saying it in words, and the row is deliberately NOT clickable in
     the way the others are... it still opens the ticket, but it does not
     pretend to be a queue item. */
  .seq-row.decision { border-color:#5e4322; border-left-color:var(--decision); background:#241a10; }
  .seq-row.decision:hover { border-color:var(--decision); }
  .seq-row.decision .seq-pos { color:var(--decision); }
  .seq-row.decision .seq-id { color:var(--decision); }
  .seq-row.decision .seq-kind {
    background:var(--decision); color:#1c1206; border-color:var(--decision); font-weight:700;
  }
  .seq-stop {
    color:var(--decision); font-size:12px; font-weight:650; line-height:1.5;
    margin-bottom:5px; display:flex; gap:7px; align-items:baseline;
  }
  .seq-stop .mark { flex:none; }

  /* Failure has to be loud. A parse error that rendered as an empty panel would
     read as "nothing planned", which is the one thing this section must never
     accidentally say. */
  .seq-error, .seq-problems {
    margin:11px 12px; padding:10px 12px; border-radius:8px;
    border:1px solid #5a2b2b; background:#2a1b1b; color:#ffb4b1; font-size:12.5px; line-height:1.55;
  }
  .seq-problems { margin-top:0; }
  .seq-error b, .seq-problems b { color:#fff; }
  .seq-problems ul { margin:6px 0 0; padding-left:20px; }
  .seq-problems li { margin:3px 0; }
  .seq-loading { padding:12px 14px; color:var(--dim); font-size:12.5px; font-style:italic; }

  @media (max-width:900px){
    .seq { margin:14px 12px 0; }
    .seq-row { grid-template-columns:22px 1fr; }
    .seq-row .seq-why { grid-column:1 / -1; }
  }

  .board { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; padding:20px; align-items:start; }
  @media (max-width:900px){ .board{ grid-template-columns:1fr; } }

  .col { background:var(--panel); border:1px solid var(--line); border-radius:10px; min-height:120px; }
  .col > h2 {
    font-size:12px; text-transform:uppercase; letter-spacing:.8px; margin:0;
    padding:12px 14px; border-bottom:1px solid var(--line); color:var(--dim);
    display:flex; align-items:center; gap:8px;
  }
  .count { background:var(--panel2); color:var(--fg); border-radius:20px; padding:1px 8px; font-size:11px; }
  .col-open  > h2 { border-top:2px solid var(--open);  border-radius:10px 10px 0 0; }
  .col-inprogress > h2 { border-top:2px solid var(--prog); border-radius:10px 10px 0 0; }
  .col-completed  > h2 { border-top:2px solid var(--done); border-radius:10px 10px 0 0; }
  .cards { padding:12px; display:flex; flex-direction:column; gap:10px; }
  .empty { color:var(--dim); font-size:13px; padding:8px 2px; font-style:italic; }

  .card {
    background:var(--panel2); border:1px solid var(--line); border-radius:8px;
    padding:11px 12px; cursor:pointer; transition:border-color .12s, transform .12s;
  }
  .card:hover { border-color:var(--accent); transform:translateY(-1px); }
  .card .idline { display:flex; align-items:center; gap:8px; margin-bottom:5px; }
  .id { font:600 11px ui-monospace,SFMono-Regular,Menlo,monospace; color:var(--accent); }
  /* the ticket's execution-order number (the Order header field), right-aligned
     on the id line so "what comes next" is readable in any sort mode */
  .ordnum { margin-left:auto; font:600 10px ui-monospace,SFMono-Regular,Menlo,monospace; color:var(--dim); }
  .card h3 { font-size:13.5px; margin:0 0 8px; font-weight:600; line-height:1.35; }
  .tags { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .tag { font-size:10.5px; padding:1.5px 7px; border-radius:20px; border:1px solid var(--line); color:var(--dim); }
  .tag.High { color:#ff9b9b; border-color:#5a2b2b; }
  .tag.Medium { color:#e0c07a; border-color:#5a4a2b; }
  .tag.Low { color:#8b93a7; }
  .card.undone { opacity:.72; }
  .tag.undone { color:#c9a3ff; border-color:#4a3a63; background:#221b2e; }
  .undone-note { font-style:italic; }
  /* complexity, on a cool ramp so it reads as effort rather than urgency */
  .tag.cx { border-style:dashed; }
  .tag.cx-Trivial { color:#6fbf8f; border-color:#2f5a42; }
  .tag.cx-Simple  { color:#79b7d6; border-color:#2f4a5a; }
  .tag.cx-Moderate{ color:#8a9ad6; border-color:#39406b; }
  .tag.cx-Complex { color:#c08ad6; border-color:#553a6b; }
  .tag.cx-Very-Complex { color:#e08ab0; border-color:#6b3a52; }
  .tag.blocked { color:#ffb4b1; border-color:#5a2b2b; background:#2a1b1b; }

  /* phase grouping */
  .phase { display:flex; flex-direction:column; gap:10px; }
  .phase + .phase { margin-top:6px; }
  .phase-head {
    display:flex; align-items:center; gap:8px; padding:2px 2px 6px;
    border-bottom:1px dashed var(--line); margin-bottom:2px;
    cursor:pointer; user-select:none;
  }
  .phase-head:hover .phase-label { color:var(--accent); }
  .phase-head:focus-visible { outline:1px solid var(--accent); outline-offset:2px; }
  .chevron {
    flex:none; width:10px; font-size:9px; text-align:center; color:var(--dim);
    display:inline-block; transition:transform .12s ease;
  }
  .phase.collapsed .chevron { transform:rotate(-90deg); }
  .phase.collapsed .phase-body { display:none; }
  .phase-num {
    background:var(--accent); color:#08121f; font:700 10px/1 ui-monospace,Menlo,monospace;
    width:18px; height:18px; border-radius:5px; display:grid; place-items:center; flex:none;
  }
  .phase-label { font-size:11.5px; font-weight:650; letter-spacing:.3px; color:var(--fg); }
  .phase-count { margin-left:auto; font-size:10.5px; color:var(--dim); }
  .phase-agg { padding:0 2px 8px; margin-top:-4px; }
  .phase-agg .bar { margin-top:0; }
  .phase-body { display:flex; flex-direction:column; gap:10px; }

  .bar { height:4px; background:#0d0f14; border-radius:3px; overflow:hidden; margin-top:9px; }
  .bar > i { display:block; height:100%; background:var(--done); }
  .barlabel { font-size:10.5px; color:var(--dim); margin-top:4px; }

  /* detail */
  .scrim { position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; z-index:10; }
  .scrim.show { display:block; }
  .detail {
    position:fixed; top:0; right:0; height:100%; width:min(760px,92vw); z-index:11;
    background:var(--panel); border-left:1px solid var(--line);
    transform:translateX(100%); transition:transform .18s ease; display:flex; flex-direction:column;
  }
  .detail.show { transform:none; }
  .detail header { position:static; }
  .detail .body { overflow:auto; padding:18px 22px 60px; }
  .close { background:none; border:1px solid var(--line); color:var(--fg); border-radius:6px;
           padding:4px 10px; cursor:pointer; font-size:13px; }
  .close:hover { border-color:var(--accent); }
  .filepath { font:11px ui-monospace,Menlo,monospace; color:var(--dim); }

  /* rendered markdown */
  .md h1 { font-size:19px; margin:0 0 14px; }
  .md h2 { font-size:15px; margin:22px 0 8px; padding-bottom:5px; border-bottom:1px solid var(--line); }
  .md h3 { font-size:13.5px; margin:18px 0 6px; color:var(--dim); text-transform:uppercase; letter-spacing:.5px; }
  .md p { margin:9px 0; }
  .md ul { margin:8px 0; padding-left:22px; }
  .md li { margin:4px 0; }
  .md li.task { list-style:none; margin-left:-18px; }
  .md code { font:12px ui-monospace,Menlo,monospace; background:#0d0f14; padding:1.5px 5px; border-radius:4px; }
  .md pre { background:#0d0f14; border:1px solid var(--line); border-radius:8px; padding:12px; overflow:auto; }
  .md pre code { background:none; padding:0; font-size:12px; line-height:1.5; }
  .md table { border-collapse:collapse; margin:10px 0; width:100%; display:block; overflow-x:auto; }
  .md th,.md td { border:1px solid var(--line); padding:6px 10px; text-align:left; font-size:12.5px; }
  .md th { background:var(--panel2); }
  .md a { color:var(--accent); }
  .md hr { border:none; border-top:1px solid var(--line); margin:20px 0; }
  .md blockquote { margin:10px 0; padding-left:12px; border-left:3px solid var(--line); color:var(--dim); }
</style>
</head>
<body>

<header>
  <h1>HollowPoint — Backlog</h1>
  <div class="meta" id="summary"></div>
  <a class="nav" href="/architecture">Architecture →</a>
  <a class="nav" href="/decisions">Decisions →</a>
  <div class="controls">
    <label for="sortby">Sort</label>
    <select id="sortby">
      <option value="phase">Phase</option>
      <option value="order">Execution order</option>
      <option value="priority">Priority</option>
      <option value="id">ID</option>
    </select>
    <span class="search-wrap" id="search-wrap">
      <input type="text" id="search" placeholder="Search tickets…" autocomplete="off" spellcheck="false" aria-label="Search tickets">
      <button class="search-clear" id="search-clear" title="Clear search (Esc)" aria-label="Clear search">✕</button>
    </span>
    <span class="meta" id="search-count"></span>
    <button class="ctl" id="collapse-all">Collapse all</button>
    <button class="ctl" id="expand-all">Expand all</button>
  </div>
  <!-- Filled in by drawCI() from /api/ci. The two placeholders below are what
       shows for the one poll before the first response lands -- they exist so
       the header is the right size from the first paint, not so they are ever
       a status anyone reads. -->
  <div class="gh-links" id="gh-links">
    <span class="ci-badge" data-state="unknown"><span class="ci-name">CI</span><span class="ci-state"><span class="ci-dot"></span><span class="ci-label">checking…</span></span><span class="ci-note"></span></span>
    <span class="ci-badge" data-state="unknown"><span class="ci-name">Full build</span><span class="ci-state"><span class="ci-dot"></span><span class="ci-label">checking…</span></span><span class="ci-note"></span></span>
    <a class="nav" href="https://github.com/ywadi/hollow_point" target="_blank" rel="noopener">GitHub ↗</a>
  </div>
  <div class="spacer"></div>
  <div class="meta"><span class="dot" id="dot"></span><span id="status">loading…</span></div>
</header>

<!-- Filled by drawSequence() from /api/sequence. Above the board on purpose:
     the board is every ticket there is, this is the handful in flight, and the
     complaint that produced it was that the sequence existed in the README and
     was invisible here. -->
<section class="seq" id="sequence">
  <div class="seq-loading">Loading the current ticket sequence…</div>
</section>

<div class="board" id="board"></div>

<div class="scrim" id="scrim"></div>
<aside class="detail" id="detail">
  <header>
    <div>
      <div class="id" id="d-id"></div>
      <div class="filepath" id="d-file"></div>
    </div>
    <div class="spacer"></div>
    <button class="close" id="d-close">Close ✕</button>
  </header>
  <div class="body md" id="d-body"></div>
</aside>

<script src="/markdown.js"></script>
<script>
'use strict';

const POLL_MS = 10000;
let openTaskId = null;
let lastSignature = '';

// Phase-group collapse state, keyed by "<columnId>__<phaseOrder>" so it stays
// stable across reloads and across the 10s poll (which redraws whenever the
// task data signature changes -- without persistence every redraw would
// re-expand every group, which defeats the point of collapsing them).
const COLLAPSE_KEY = 'hpBoard.collapsedPhases.v1';
const SORT_KEY = 'hpBoard.sortBy.v2';

// Sort mode is a *view* concern, so it is applied client-side rather than by the
// server -- the folders remain the source of truth either way.
//
// The default is Phase, and it is worth saying why it is not Execution order.
// Both put the same ticket on top -- phase groups order their cards by the
// same Order field -- so the "what do I work next" question is answered either
// way. The difference is everything else on screen: the phase view keeps the
// headings and their aggregate progress bars, which is the structure people
// actually navigate 91 open tickets by. Execution order renders flat, and a
// flat list of ninety-one is a worse default than a grouped one that happens
// to start in the same place. Pick Execution order when you want the queue
// without the scaffolding.
//
// The key is versioned: making Execution order the default was tried briefly
// and lost the phase headings, so anyone who loaded the board in that window
// has 'order' persisted and would never see this default. Bumping v1 -> v2
// retires those values. Collapse state lives under its own key and survives.
let sortBy = localStorage.getItem(SORT_KEY) || 'phase';

// Each open ticket carries an `| **Order** | N |` row in its header table --
// the hand-derived execution order from backlog/README.md, kept in the tickets
// so this board and that table read one field and cannot disagree. The server
// predates the field and does not parse it, but it already ships each ticket's
// full markdown, so it is read here with the same regex shape as server.js's
// field(). Tickets without one (completed, in progress) sort after those with.
const ORDER_NONE = 1e9;
function orderOf(md) {
  const m = (md || '').match(/\|\s*\*\*Order\*\*\s*\|\s*(\d+)\s*\|/i);
  return m ? Number(m[1]) : null;
}
const ord = (t) => (t.order == null ? ORDER_NONE : t.order);

const PRIO_RANK = { High: 0, Medium: 1, Low: 2 };
function sortTasks(tasks) {
  const t = tasks.slice();
  if (sortBy === 'order') {
    t.sort((a, b) => ord(a) - ord(b) || a.phaseOrder - b.phaseOrder || a.id.localeCompare(b.id));
  } else if (sortBy === 'priority') {
    t.sort((a, b) => (PRIO_RANK[a.priority] ?? 9) - (PRIO_RANK[b.priority] ?? 9)
                  || a.phaseOrder - b.phaseOrder
                  || ord(a) - ord(b)
                  || a.id.localeCompare(b.id));
  } else if (sortBy === 'id') {
    t.sort((a, b) => a.id.localeCompare(b.id));
  } else {
    // Phase view: groups by phase, and *within* a group cards follow the same
    // Order field -- so this view and the execution-order view agree on what
    // sits on top, they just differ in whether the phase headings show.
    t.sort((a, b) => a.phaseOrder - b.phaseOrder || ord(a) - ord(b) || a.id.localeCompare(b.id));
  }
  return t;
}
function loadCollapsedPhases() {
  try { return JSON.parse(localStorage.getItem(COLLAPSE_KEY)) || {}; }
  catch (e) { return {}; }
}
function saveCollapsedPhases() {
  try { localStorage.setItem(COLLAPSE_KEY, JSON.stringify(collapsedPhases)); }
  catch (e) { /* storage unavailable -- collapse still works for this session */ }
}
let collapsedPhases = loadCollapsedPhases();

function applyCollapsedPhases() {
  document.querySelectorAll('.phase').forEach((el) => {
    const collapsed = !!collapsedPhases[el.dataset.phaseKey];
    el.classList.toggle('collapsed', collapsed);
    const head = el.querySelector('.phase-head');
    if (head) head.setAttribute('aria-expanded', String(!collapsed));
  });
}

// --- search / filter ---------------------------------------------------------
//
// Search is a view concern, like sort: it never touches the underlying task
// data, so a card is hidden by adding a class to the element draw() already
// built, not by leaving it out of the render. That keeps phase aggregate
// totals (computed from the full task list in cardsHtml) honest, and keeps a
// repaint cheap -- reapplying the filter after a poll is just re-running this
// same class toggle, not re-sorting or re-fetching anything.
//
// Matching is deliberately dumb substring matching, not fuzzy search -- with
// ~100 tickets a plain substring is fast enough and its results are
// predictable. The one bit of smarts is the ticket id: "93", "0093" and
// "T0093" all need to find T0093, so the id is checked against its numeric
// form as well as the raw string.
//
// Not persisted to localStorage on purpose (unlike sort and collapse state):
// a stale filter left over from a previous visit would be confusing, so every
// load starts with an empty box.
let searchQuery = '';

function idVariants(id) {
  const m = id.match(/^T(\d+)$/i);
  if (!m) return [id.toLowerCase()];
  const digits = m[1];                 // "0093"
  const bare = String(Number(digits)); // "93"
  return [id.toLowerCase(), digits, bare];
}

function taskMatchesQuery(t, q) {
  if (!q) return true;
  if (idVariants(t.id).some((v) => v.includes(q))) return true;
  return [t.title, t.phaseLabel, t.priority, t.complexity]
    .some((f) => (f || '').toLowerCase().includes(q));
}

// esc() and renderMarkdown() live in markdown.js now, shared with
// decisions.html -- see that file for why, and for the header comment this
// used to carry.

function card(t) {
  const pct = t.checksTotal ? Math.round((t.checksDone / t.checksTotal) * 100) : 0;
  const prio = ['High','Medium','Low'].includes(t.priority) ? t.priority : '';

  // A superseded ticket was closed WITHOUT the work being done, so its checkboxes
  // are legitimately unticked. Showing it a 0% progress bar next to genuinely
  // finished tickets reads as stalled work, which is misleading -- so show the
  // status instead of a bar. Ticking those boxes to make the bar look tidy would
  // be a lie about what happened.
  const superseded = /superseded/i.test(t.status || '');
  const dropped = /dropped/i.test(t.status || '');
  const closedUndone = superseded || dropped;

  return `
    <div class="card${closedUndone ? ' undone' : ''}" data-id="${esc(t.id)}">
      <div class="idline"><span class="id">${esc(t.id)}</span>${t.order != null ? `<span class="ordnum" title="Execution order">${t.order}</span>` : ''}</div>
      <h3>${esc(t.title)}</h3>
      <div class="tags">
        ${prio ? `<span class="tag ${prio}">${prio}</span>` : ''}
        ${t.complexity ? `<span class="tag cx cx-${esc(t.complexity).replace(/\s+/g,'-')}">${esc(t.complexity)}</span>` : ''}
        ${t.blocked ? '<span class="tag blocked">Blocked</span>' : ''}
        ${superseded ? '<span class="tag undone">Superseded</span>' : ''}
        ${dropped ? '<span class="tag undone">Dropped</span>' : ''}
      </div>
      ${closedUndone
        ? `<div class="barlabel undone-note">closed without completing — see the ticket</div>`
        : t.checksTotal ? `<div class="bar"><i style="width:${pct}%"></i></div>
        <div class="barlabel">${t.checksDone}/${t.checksTotal} checks</div>` : ''}
    </div>`;
}

let current = null;

// Cards are grouped under phase headings when a column has phases, so the
// column reads in the order the work is meant to happen. A column whose tasks
// carry no phase renders flat, unchanged.
//
// Each group's header carries an aggregate progress bar -- total checksDone /
// checksTotal across every ticket in the phase -- and can be collapsed. The
// aggregate lives in the header (not the collapsible body), so it stays
// visible and meaningful when the group is collapsed.
function cardsHtml(tasks, colId) {
  if (!tasks.length) return '<div class="empty">Nothing here</div>';
  tasks = sortTasks(tasks);
  // Phase grouping only applies while sorting by phase. Priority and ID cut
  // across phases, so groups would misrepresent the ordering; execution order
  // respects phases but renders flat on purpose -- it is the "what's next"
  // list, and phase structure is what the Phase view is for.
  if (sortBy !== 'phase' || !tasks.some((t) => t.phase)) return tasks.map(card).join('');

  const groups = [];
  for (const t of tasks) {
    const key = t.phaseOrder;
    let g = groups.find((g) => g.key === key);
    if (!g) groups.push((g = { key, label: t.phaseLabel, tasks: [] }));
    g.tasks.push(t);
  }
  groups.sort((a, b) => a.key - b.key);

  return groups.map((g) => {
    // Exclude superseded/dropped tickets from the aggregate: their checkboxes are
    // unticked because the work was never done, not because it is outstanding.
    // Counting them would permanently drag a phase's progress below 100%.
    const counted = g.tasks.filter((t) => !/superseded|dropped/i.test(t.status || ''));
    const done = counted.reduce((n, t) => n + t.checksDone, 0);
    const total = counted.reduce((n, t) => n + t.checksTotal, 0);
    const pct = total ? Math.round((done / total) * 100) : 0;
    const phaseKey = `${colId}__${g.key}`;
    return `
    <div class="phase" data-phase-key="${esc(phaseKey)}">
      <div class="phase-head" role="button" tabindex="0" aria-expanded="true">
        <span class="chevron">&#9662;</span>
        ${g.key < 999 ? `<span class="phase-num">${g.key}</span>` : ''}
        <span class="phase-label">${esc(g.label)}</span>
        <span class="phase-count">${g.tasks.length}</span>
      </div>
      ${total ? `<div class="phase-agg">
        <div class="bar"><i style="width:${pct}%"></i></div>
        <div class="barlabel">${done}/${total} checks</div>
      </div>` : ''}
      <div class="phase-body">${g.tasks.map(card).join('')}</div>
    </div>`;
  }).join('');
}

function draw(data) {
  current = data;
  // Derive each task's execution order from its markdown once per repaint,
  // not once per sort comparison -- see the comment above orderOf().
  data.columns.forEach((c) => c.tasks.forEach((t) => { t.order = orderOf(t.markdown); }));
  document.getElementById('board').innerHTML = data.columns.map((c) => `
    <section class="col col-${c.id}">
      <h2>${c.title} <span class="count">${c.tasks.length}</span></h2>
      <div class="cards">
        ${cardsHtml(c.tasks, c.id)}
        ${c.tasks.length ? '<div class="empty search-empty" style="display:none">No tickets match &#8220;<span class="q"></span>&#8221;</div>' : ''}
      </div>
    </section>`).join('');

  const total = data.columns.reduce((n, c) => n + c.tasks.length, 0);
  const done = (data.columns.find((c) => c.id === 'completed') || {tasks:[]}).tasks.length;
  document.getElementById('summary').textContent = `${done}/${total} complete`;

  document.querySelectorAll('.card').forEach((el) =>
    el.addEventListener('click', () => openTask(el.dataset.id)));

  // Toggle a phase group's collapse state. stopPropagation keeps this from
  // ever being interpreted as a card click (cards attach their own listener
  // directly, so this is belt-and-suspenders, not load-bearing).
  const togglePhase = (headEl) => {
    const phase = headEl.closest('.phase');
    const key = phase.dataset.phaseKey;
    collapsedPhases[key] = !collapsedPhases[key];
    saveCollapsedPhases();
    applyCollapsedPhases();
    if (searchQuery) applySearchFilter();
  };
  document.querySelectorAll('.phase-head').forEach((el) => {
    el.addEventListener('click', (e) => { e.stopPropagation(); togglePhase(el); });
    el.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); togglePhase(el); }
    });
  });
  applyCollapsedPhases();
  applySearchFilter(); // a poll's repaint must re-apply the filter, not drop it

  if (openTaskId) renderDetail(openTaskId, true);
}

function findTask(id) {
  for (const c of current.columns) { const t = c.tasks.find((t) => t.id === id); if (t) return t; }
  return null;
}

// Toggles visibility on the DOM draw() just built; never mutates task data,
// sort order, or collapsedPhases/localStorage. See the "search / filter"
// comment above taskMatchesQuery for why.
function applySearchFilter() {
  if (!current) return;
  const q = searchQuery;
  const active = !!q;

  let total = 0, matched = 0;
  current.columns.forEach((c) => c.tasks.forEach((t) => {
    total++;
    if (taskMatchesQuery(t, q)) matched++;
  }));
  searchCountEl.textContent = active ? `${matched} of ${total} tickets` : '';

  document.querySelectorAll('.col').forEach((colEl) => {
    let visible = 0;
    colEl.querySelectorAll('.card').forEach((cardEl) => {
      const t = findTask(cardEl.dataset.id);
      const isMatch = !active || (t && taskMatchesQuery(t, q));
      cardEl.classList.toggle('search-hidden', !isMatch);
      if (isMatch) visible++;
    });

    // A phase group with no matches is hidden entirely; one with matches is
    // force-expanded so the result is visible even if the user had it
    // collapsed -- but collapsedPhases (and therefore localStorage) is never
    // written here, so clearing the search and calling applyCollapsedPhases()
    // again puts every group back exactly where the user left it.
    colEl.querySelectorAll('.phase').forEach((phaseEl) => {
      if (!active) { phaseEl.classList.remove('search-hidden'); return; }
      const anyVisible = !!phaseEl.querySelector('.card:not(.search-hidden)');
      phaseEl.classList.toggle('search-hidden', !anyVisible);
      if (anyVisible) {
        phaseEl.classList.remove('collapsed');
        const head = phaseEl.querySelector('.phase-head');
        if (head) head.setAttribute('aria-expanded', 'true');
      }
    });

    const noResults = colEl.querySelector('.search-empty');
    if (noResults) {
      const show = active && !!colEl.querySelector('.card') && visible === 0;
      noResults.style.display = show ? '' : 'none';
      if (show) noResults.querySelector('.q').textContent = searchInput.value.trim();
    }
  });

  // Search cleared -- restore exactly the collapse state the user saved,
  // undoing any forced expand above.
  if (!active) applyCollapsedPhases();
}

function renderDetail(id, silent) {
  const t = findTask(id);
  if (!t) { if (!silent) closeDetail(); return; }
  document.getElementById('d-id').textContent = t.id;
  document.getElementById('d-file').textContent = t.file;
  document.getElementById('d-body').innerHTML = renderMarkdown(t.markdown);
}

function openTask(id) {
  openTaskId = id;
  renderDetail(id);
  document.getElementById('detail').classList.add('show');
  document.getElementById('scrim').classList.add('show');
}

function closeDetail() {
  openTaskId = null;
  document.getElementById('detail').classList.remove('show');
  document.getElementById('scrim').classList.remove('show');
}

document.getElementById('d-close').addEventListener('click', closeDetail);
document.getElementById('scrim').addEventListener('click', closeDetail);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDetail(); });

// Mutates the shared collapsedPhases map, matching how the per-header toggle
// works -- saveCollapsedPhases() reads that variable rather than taking an arg.
function setAllCollapsed(collapsed) {
  document.querySelectorAll('.phase').forEach((el) => {
    collapsedPhases[el.dataset.phaseKey] = collapsed;
  });
  saveCollapsedPhases();
  applyCollapsedPhases();
  if (searchQuery) applySearchFilter();
}

const sortSel = document.getElementById('sortby');
sortSel.value = sortBy;
sortSel.addEventListener('change', () => {
  sortBy = sortSel.value;
  localStorage.setItem(SORT_KEY, sortBy);
  if (current) draw(current);   // re-render immediately; do not wait for the poll
});
document.getElementById('collapse-all').addEventListener('click', () => setAllCollapsed(true));
document.getElementById('expand-all').addEventListener('click', () => setAllCollapsed(false));

const searchInput = document.getElementById('search');
const searchWrap = document.getElementById('search-wrap');
const searchCountEl = document.getElementById('search-count');

function setSearchQuery(raw) {
  searchQuery = raw.trim().toLowerCase();
  searchWrap.classList.toggle('has-value', !!raw);
  applySearchFilter();
}

searchInput.addEventListener('input', () => setSearchQuery(searchInput.value));
searchInput.addEventListener('keydown', (e) => {
  // Scoped to the box itself (stopPropagation) so Escape here clears the
  // search rather than also tripping the document-level handler that closes
  // the detail panel.
  if (e.key === 'Escape') {
    e.stopPropagation();
    searchInput.value = '';
    setSearchQuery('');
  }
});
document.getElementById('search-clear').addEventListener('click', () => {
  searchInput.value = '';
  setSearchQuery('');
  searchInput.focus();
});

// --- current ticket sequence ---------------------------------------------------
//
// Painted from /api/sequence, which parses the section out of
// backlog/README.md. Nothing about the sequence is authored here -- not the
// tickets, not the order, not the wording of why a row sits where it does. If
// it were, the board and the document would be two sources that drift, and the
// section's own rule is that a stale sequence is worse than none because it is
// trusted. A rendered page is the most trusted copy there is.
//
// The one judgement this file makes is the same one drawCI() makes: how to say
// it. And there is exactly one thing it has to say unmistakably.

const SEQ_POLL_MS = 30000;   // it changes at human-edit speed, not build speed
let lastSeqSig = '';

function seqRow(item) {
  const decision = item.kind === 'decision';
  return `
    <div class="seq-row ${decision ? 'decision' : 'code'}" data-ticket="${esc(item.ticket)}" data-open="1"
         title="${esc(item.file)}">
      <div class="seq-pos">${item.position}</div>
      <div class="seq-meta">
        <span class="seq-id">${esc(item.id)}</span>
        <span class="seq-kind">${decision ? 'DECISION' : 'code'}</span>
      </div>
      <div>
        ${decision ? `<div class="seq-stop"><span class="mark">&#9873;</span><span>${mdInline(item.kindLabel)}
          &mdash; stop and ask. Do not pick a branch on the owner's behalf.</span></div>` : ''}
        <div class="seq-why">${mdInline(item.why)}</div>
      </div>
    </div>`;
}

function drawSequence(data) {
  const el = document.getElementById('sequence');

  // No rows to show. Say why, loudly, and name the file to fix -- an empty
  // panel here would read as "nothing planned", which is a lie the board is
  // not allowed to tell.
  if (!data.ok) {
    el.innerHTML = `
      <div class="seq-head">
        <span class="seq-title">Current ticket sequence</span>
        <span class="seq-date missing">unavailable</span>
        ${data.source ? `<span class="seq-src">${esc(data.source)}</span>` : ''}
      </div>
      <div class="seq-error"><b>The sequence could not be read.</b><br>${esc(data.error || 'unknown error')}</div>`;
    return;
  }

  const problems = data.problems || [];
  el.innerHTML = `
    <div class="seq-head">
      <span class="seq-title">Current ticket sequence</span>
      <span class="seq-date${data.setDate ? '' : ' missing'}">${data.setDate ? 'set ' + esc(data.setDate) : 'undated'}</span>
      <span class="seq-note">what happens next, in order &mdash; the board below is everything else</span>
      <span class="seq-src">${esc(data.source || '')}</span>
    </div>
    ${problems.length ? `<div class="seq-problems"><b>The sequence has gone stale:</b>
      <ul>${problems.map((p) => `<li>${esc(p)}</li>`).join('')}</ul></div>` : ''}
    <div class="seq-rows">${data.items.map(seqRow).join('')}</div>`;

  // Opens the ticket's detail panel, the same one a card opens. Guarded on the
  // board data having arrived and actually containing the ticket: the two
  // endpoints are polled independently, so the sequence can paint first.
  el.querySelectorAll('.seq-row[data-open="1"]').forEach((row) => {
    row.addEventListener('click', () => {
      const id = row.dataset.ticket;
      if (current && findTask(id)) openTask(id);
    });
  });
}

async function pollSequence() {
  let payload;
  try {
    const r = await fetch('/api/sequence', { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    payload = await r.json();
  } catch (err) {
    // The board's own server, not GitHub -- so this is "cannot ask" rather than
    // "the sequence is broken", and it must not be worded as the latter.
    payload = { ok: false, error: 'The board server is unreachable, so the sequence could not be fetched — ' + String((err && err.message) || err) };
  }
  const sig = JSON.stringify(payload.ok ? [payload.setDate, payload.problems, payload.items] : ['err', payload.error]);
  if (sig !== lastSeqSig) { lastSeqSig = sig; drawSequence(payload); }
  setTimeout(pollSequence, SEQ_POLL_MS);
}
pollSequence();

// --- CI status ---------------------------------------------------------------
//
// The server does the deriving (see the note above readCI() in server.js for
// why GitHub's badge.svg could not be kept); this only paints what it is told,
// and the one judgement it makes is how to word it.
//
// Every state gets its own label, because the failure mode being fixed here is
// exactly the one where several distinct situations were collapsed into "red".
const CI_LABEL = {
  success: 'passing', failure: 'failing',
  in_progress: 'building', queued: 'queued',
  cancelled: 'cancelled', skipped: 'skipped',
  action_required: 'action required', neutral: 'neutral',
  none: 'no runs', unavailable: 'unavailable', unknown: 'unknown',
};

function ciAgo(iso) {
  if (!iso) return '';
  const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return `${Math.round(s / 60)}m ago`;
  if (s < 86400) return `${Math.round(s / 3600)}h ago`;
  return `${Math.round(s / 86400)}d ago`;
}

// The suffix after the state. Two cases, and both exist because the state on
// its own would otherwise overstate what is known:
//   building/queued -- the verdict shown is from a previous run, not this one
//   settled but stale -- the newest run was cancelled, so the green or red
//                        being shown is about an older commit
function ciNote(wf) {
  if (wf.state === 'in_progress' || wf.state === 'queued') {
    return wf.verdict ? `· last ${CI_LABEL[wf.verdict.state] || wf.verdict.state}` : '';
  }
  if (wf.verdictIsStale && wf.latest) {
    return `· latest ${CI_LABEL[wf.latest.state] || wf.latest.state}`;
  }
  return '';
}

function ciTitle(wf) {
  if (wf.state === 'unavailable') return `${wf.label}: status unavailable — ${wf.error || 'GitHub unreachable'}`;
  const lines = [];
  const run = (r, what) => r
    ? `${what}: #${r.number} ${CI_LABEL[r.state] || r.state} — ${r.title || ''} (${r.sha}) ${ciAgo(r.updatedAt)}`
    : null;
  if (wf.running) lines.push(run(wf.running, 'In flight'));
  if (wf.verdict) lines.push(run(wf.verdict, 'Last verdict'));
  // A run GitHub still calls queued long after any real queue would have
  // cleared. Named here rather than dropped: the header stops claiming it is in
  // flight, but the wedge is real and hiding it entirely is its own lie.
  if (wf.stalled) {
    lines.push(run(wf.stalled, 'Stalled queue'));
    lines.push('  ^ stuck on GitHub, not counted as in flight');
  }
  if (wf.latest && (!wf.verdict || wf.latest.id !== wf.verdict.id) && (!wf.running || wf.latest.id !== wf.running.id)) {
    lines.push(run(wf.latest, 'Newest run'));
  }
  if (!lines.length) lines.push(`No runs on ${wf.branch || 'this branch'}`);
  if (wf.verdictIsStale) {
    lines.push('');
    lines.push('The verdict shown is not from the newest run — a cancelled run');
    lines.push('says nothing about the code, so it does not overwrite one that does.');
  }
  lines.push('');
  lines.push('Click to open on GitHub.');
  return `${wf.label} (${wf.branch})\n` + lines.filter((l) => l !== null).join('\n');
}

function drawCI(data) {
  const links = document.getElementById('gh-links');
  const repoLink = links.querySelector('a.nav');
  const badges = (data.workflows || []).map((wf) => {
    // Deep-link at the run the state is actually about: the one executing when
    // it is building, the one that reached the verdict otherwise. Falling back
    // to the workflow's run list, which is where the old badge always pointed.
    const href = (wf.state === 'in_progress' || wf.state === 'queued')
      ? (wf.running && wf.running.url) || wf.runsUrl
      : (wf.verdict && wf.verdict.url) || (wf.latest && wf.latest.url) || wf.runsUrl;
    const note = ciNote(wf);
    return `<a class="ci-badge" data-state="${esc(wf.state)}" href="${esc(href)}"
       target="_blank" rel="noopener" title="${esc(ciTitle(wf))}">
      <span class="ci-name">${esc(wf.label)}</span>
      <span class="ci-state"><span class="ci-dot"></span><span class="ci-label">${esc(CI_LABEL[wf.state] || wf.state)}</span></span>
      <span class="ci-note">${esc(note)}</span>
    </a>`;
  }).join('');
  links.innerHTML = badges + (repoLink ? repoLink.outerHTML : '');
}

// Independent of the 10s backlog poll: this one leaves the machine, and the
// server caches it anyway. Follow the server's advertised TTL rather than
// guessing -- it shortens the cache while a run is in flight (and only when
// authenticated, where the rate limit affords it), so the board tracks a
// build without ever polling faster than the data can change.
let ciTimer = null;
async function pollCI() {
  let nextMs = 60000;
  try {
    const r = await fetch('/api/ci', { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    drawCI(data);
    nextMs = Math.max(10000, Number(data.ttlMs) || 60000);
  } catch (err) {
    // The board's own server is unreachable; the dot in the corner already
    // says so, so just mark the CI state unknown rather than claim a failure.
    drawCI({ workflows: [
      { id: 'ci', label: 'CI', state: 'unavailable', error: String(err.message || err), runsUrl: 'https://github.com/ywadi/hollow_point/actions/workflows/ci.yml' },
      { id: 'full', label: 'Full build', state: 'unavailable', error: String(err.message || err), runsUrl: 'https://github.com/ywadi/hollow_point/actions/workflows/full-build.yml' },
    ] });
  }
  clearTimeout(ciTimer);
  ciTimer = setTimeout(pollCI, nextMs);
}
pollCI();

async function poll() {
  const dot = document.getElementById('dot'), status = document.getElementById('status');
  try {
    const r = await fetch('/api/tasks', { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();

    // Only repaint when something actually changed, so an open detail panel
    // does not flicker or lose scroll position every 10 seconds.
    const sig = JSON.stringify(data.columns.map((c) => c.tasks.map((t) => t.id + ':' + t.mtime)));
    if (sig !== lastSignature) { lastSignature = sig; draw(data); }

    dot.className = 'dot';
    status.textContent = 'updated ' + new Date().toLocaleTimeString();
  } catch (err) {
    dot.className = 'dot err';
    status.textContent = 'server unreachable — retrying';
  }
}

poll();
setInterval(poll, POLL_MS);
</script>
</body>
</html>
