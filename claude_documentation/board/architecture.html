<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HollowPoint — Architecture</title>
<style>
  :root {
    --bg:#0f1115; --panel:#161922; --panel2:#1c2029; --line:#272c38;
    --fg:#e6e9ef; --dim:#8b93a7; --accent:#5b9dff;
    --done:#3fb950; --open:#8b93a7; --warn:#e0a33e; --bad:#d9534f;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  header { display:flex; align-items:center; gap:14px; flex-wrap:wrap;
           padding:14px 20px; border-bottom:1px solid var(--line); background:var(--panel);
           position:sticky; top:0; z-index:20; }
  h1 { font-size:16px; margin:0; font-weight:650; }
  .spacer { flex:1; }
  .meta { color:var(--dim); font-size:12px; }
  a.nav { color:var(--accent); text-decoration:none; font-size:12.5px;
          border:1px solid var(--line); border-radius:6px; padding:4px 10px; }
  a.nav:hover { border-color:var(--accent); }
  .legend { display:flex; gap:10px; font-size:11px; color:var(--dim); align-items:center; }
  .sw { width:10px; height:10px; border-radius:3px; display:inline-block; margin-right:4px; }

  .wrap { padding:18px 20px 80px; display:flex; flex-direction:column; gap:14px; }

  .layer { border:1px solid var(--line); border-radius:10px; background:var(--panel); overflow:hidden; }
  .layer > h2 { margin:0; padding:10px 14px; font-size:12px; text-transform:uppercase;
                letter-spacing:.9px; color:var(--dim); border-bottom:1px solid var(--line);
                display:flex; align-items:baseline; gap:10px; }
  .layer > h2 em { font-style:normal; text-transform:none; letter-spacing:0; font-size:11.5px; opacity:.75; }
  .layer > h2 .cnt { margin-left:auto; font-size:11px; }

  .groups { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:10px; padding:12px; }
  .group { border:1px solid var(--line); border-radius:8px; background:var(--panel2); padding:10px 11px; }
  .group h3 { margin:0 0 8px; font-size:12.5px; font-weight:650; display:flex; align-items:center; gap:6px; }
  .group h3 .n { margin-left:auto; font-size:10.5px; color:var(--dim); font-weight:400; }
  .bar { height:3px; background:#0d0f14; border-radius:3px; overflow:hidden; margin-bottom:8px; }
  .bar > i { display:block; height:100%; background:var(--done); }

  .chips { display:flex; flex-wrap:wrap; gap:4px; }
  .chip { font:600 10px ui-monospace,Menlo,monospace; padding:2px 6px; border-radius:5px;
          border:1px solid var(--line); color:var(--dim); cursor:pointer; background:#12151c;
          transition:border-color .1s, color .1s, transform .1s; }
  .chip:hover { border-color:var(--accent); color:var(--fg); transform:translateY(-1px); }
  .chip.done { color:var(--done); border-color:#2f5a42; }
  .chip.superseded { color:#c9a3ff; border-color:#4a3a63; opacity:.6; }
  .chip.cx-Complex { border-left:3px solid #c08ad6; }
  .chip.cx-Very-Complex { border-left:3px solid #e08ab0; }
  .chip.sel { border-color:var(--accent); color:#fff; background:#1d2a3f; }
  .chip.dep-out { border-color:var(--warn); color:var(--warn); }
  .chip.dep-in  { border-color:#79b7d6; color:#79b7d6; }
  .chip.dim { opacity:.22; }

  .hint { color:var(--dim); font-size:12px; padding:0 2px; }
  .warnbox { border:1px solid #5a2b2b; background:#241a1a; color:#ffb4b1;
             border-radius:8px; padding:10px 12px; font-size:12.5px; }

  /* detail */
  .scrim { position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; z-index:30; }
  .scrim.show { display:block; }
  .detail { position:fixed; top:0; right:0; height:100%; width:min(720px,92vw); z-index:31;
            background:var(--panel); border-left:1px solid var(--line);
            transform:translateX(100%); transition:transform .18s ease; display:flex; flex-direction:column; }
  .detail.show { transform:none; }
  .detail header { position:static; }
  .detail .body { overflow:auto; padding:16px 20px 60px; font-size:13px; }
  .close { background:none; border:1px solid var(--line); color:var(--fg);
           border-radius:6px; padding:4px 10px; cursor:pointer; }
  .close:hover { border-color:var(--accent); }
  .deps { display:flex; flex-direction:column; gap:10px; }
  .deps h4 { margin:0 0 4px; font-size:11px; text-transform:uppercase; letter-spacing:.7px; color:var(--dim); }
  .deps ul { margin:0; padding-left:0; list-style:none; display:flex; flex-wrap:wrap; gap:5px; }
</style>
</head>
<body>

<header>
  <h1>HollowPoint — Architecture</h1>
  <span class="meta" id="summary"></span>
  <a class="nav" href="/">← Backlog board</a>
  <div class="spacer"></div>
  <div class="legend">
    <span><span class="sw" style="background:#3fb950"></span>done</span>
    <span><span class="sw" style="background:#c08ad6"></span>complex</span>
    <span><span class="sw" style="background:#e08ab0"></span>very complex</span>
    <span><span class="sw" style="background:#e0a33e"></span>depends on</span>
    <span><span class="sw" style="background:#79b7d6"></span>depended on by</span>
  </div>
</header>

<div class="wrap">
  <div class="hint">Click any ticket to see what it depends on and what depends on it. Click it again to clear.</div>
  <div id="warn"></div>
  <div id="layers"></div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="detail" id="detail">
  <header>
    <div>
      <div style="font:600 12px ui-monospace,Menlo,monospace;color:var(--accent)" id="d-id"></div>
      <div style="font-size:11px;color:var(--dim)" id="d-file"></div>
    </div>
    <div class="spacer"></div>
    <button class="close" id="d-close">Close ✕</button>
  </header>
  <div class="body" id="d-body"></div>
</aside>

<script>
'use strict';
const esc = (s) => String(s).replace(/[&<>"]/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let DATA = null, selected = null;

function chipClass(t) {
  const c = ['chip'];
  if (/done/i.test(t.status)) c.push('done');
  if (/superseded|dropped/i.test(t.status)) c.push('superseded');
  if (t.complexity) c.push('cx-' + t.complexity.replace(/\s+/g,'-'));
  return c.join(' ');
}

function render() {
  const d = DATA;
  const total = d.layers.reduce((n,L)=>n+L.groups.reduce((m,g)=>m+g.tasks.length,0),0);
  const done = d.layers.reduce((n,L)=>n+L.groups.reduce((m,g)=>m+g.tasks.filter(t=>/done/i.test(t.status)).length,0),0);
  document.getElementById('summary').textContent = `${done}/${total} complete · ${d.edges.length} dependencies`;

  document.getElementById('warn').innerHTML = d.unplaced.length
    ? `<div class="warnbox"><strong>${d.unplaced.length} ticket(s) not mapped to any layer:</strong>
       ${d.unplaced.map(esc).join(', ')} — add them to ARCHITECTURE in server.js.</div>` : '';

  document.getElementById('layers').innerHTML = d.layers.map((L) => {
    const all = L.groups.flatMap(g=>g.tasks);
    const ld = all.filter(t=>/done/i.test(t.status)).length;
    return `
    <section class="layer">
      <h2>${esc(L.layer)} <em>${esc(L.blurb)}</em>
        <span class="cnt">${ld}/${all.length}</span></h2>
      <div class="groups">
        ${L.groups.map((g) => {
          const gd = g.tasks.filter(t=>/done/i.test(t.status)).length;
          const pct = g.tasks.length ? Math.round(gd/g.tasks.length*100) : 0;
          return `<div class="group">
            <h3>${esc(g.name)} <span class="n">${gd}/${g.tasks.length}</span></h3>
            <div class="bar"><i style="width:${pct}%"></i></div>
            <div class="chips">
              ${g.tasks.map(t=>`<span class="${chipClass(t)}" data-id="${t.id}" title="${esc(t.title)}">${t.id}</span>`).join('')}
            </div>
          </div>`;
        }).join('')}
      </div>
    </section>`;
  }).join('');

  document.querySelectorAll('.chip').forEach(el =>
    el.addEventListener('click', () => select(el.dataset.id === selected ? null : el.dataset.id)));
  applySelection();
}

function applySelection() {
  const chips = document.querySelectorAll('.chip');
  if (!selected) { chips.forEach(c=>c.classList.remove('sel','dep-out','dep-in','dim')); return; }
  const out = new Set(DATA.edges.filter(e=>e.from===selected).map(e=>e.to));
  const inn = new Set(DATA.edges.filter(e=>e.to===selected).map(e=>e.from));
  chips.forEach(c => {
    const id = c.dataset.id;
    c.classList.remove('sel','dep-out','dep-in','dim');
    if (id === selected) c.classList.add('sel');
    else if (out.has(id)) c.classList.add('dep-out');
    else if (inn.has(id)) c.classList.add('dep-in');
    else c.classList.add('dim');
  });
}

function findTask(id) {
  for (const L of DATA.layers) for (const g of L.groups) {
    const t = g.tasks.find(t=>t.id===id); if (t) return { t, layer:L.layer, group:g.name };
  }
  return null;
}

function select(id) {
  selected = id;
  applySelection();
  if (!id) { closeDetail(); return; }
  const found = findTask(id); if (!found) return;
  const { t, layer, group } = found;
  const out = DATA.edges.filter(e=>e.from===id).map(e=>e.to).sort();
  const inn = DATA.edges.filter(e=>e.to===id).map(e=>e.from).sort();
  const list = (ids) => ids.length
    ? `<ul>${ids.map(i=>{const f=findTask(i);return `<span class="chip" data-jump="${i}" title="${f?esc(f.t.title):''}">${i}</span>`;}).join('')}</ul>`
    : '<div class="meta">none</div>';

  document.getElementById('d-id').textContent = id;
  document.getElementById('d-file').textContent = t.file;
  document.getElementById('d-body').innerHTML = `
    <h2 style="font-size:16px;margin:0 0 10px">${esc(t.title)}</h2>
    <div class="meta" style="margin-bottom:14px">
      ${esc(layer)} › ${esc(group)} · ${esc(t.status||'')} ·
      ${esc(t.priority||'')} priority · ${esc(t.complexity||'')} ·
      ${t.checksDone}/${t.checksTotal} checks
    </div>
    <div class="deps">
      <div><h4>Depends on (${out.length})</h4>${list(out)}</div>
      <div><h4>Depended on by (${inn.length})</h4>${list(inn)}</div>
    </div>`;
  document.querySelectorAll('[data-jump]').forEach(el =>
    el.addEventListener('click', () => select(el.dataset.jump)));
  document.getElementById('detail').classList.add('show');
  document.getElementById('scrim').classList.add('show');
}

function closeDetail() {
  document.getElementById('detail').classList.remove('show');
  document.getElementById('scrim').classList.remove('show');
}
document.getElementById('d-close').addEventListener('click', () => select(null));
document.getElementById('scrim').addEventListener('click', () => select(null));
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') select(null); });

async function load() {
  try {
    const r = await fetch('/api/architecture', { cache:'no-store' });
    DATA = await r.json();
    render();
  } catch (e) {
    document.getElementById('layers').innerHTML =
      '<div class="warnbox">Could not reach the server. Is it running?</div>';
  }
}
load();
setInterval(load, 30000);
</script>
</body>
</html>
